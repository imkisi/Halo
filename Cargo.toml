[package]
name = "halo"
version = "0.2.0"
edition = "2021"
description = "High Performance Radial Shortcut Menu for Windows with Per-App Profiles"

[dependencies]
tao = "0.30"
wry = "0.47"
tray-icon = "0.19"
muda = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Gdi"
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

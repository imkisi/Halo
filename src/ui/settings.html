<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Halo Settings</title>
  <style>
    :root {
      --bg-primary: #FFFFFF;
      --bg-secondary: #F8F9FA;
      --bg-sidebar: #FAFAFA;
      --border-color: #EAEAEA;
      --text-primary: #111111;
      --text-secondary: #666666;
      --text-muted: #999999;
      --accent-blue: #1060FF;
      --accent-blue-hover: #0050EE;
      --accent-blue-light: #EBF2FF;
      --card-bg: #FFFFFF;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 18px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.12);
      --grid-dot: rgba(0, 0, 0, 0.06);
      --track-bg: #E6E8EC;
      --modal-overlay: rgba(0, 0, 0, 0.35);
    }
    body.theme-dark {
      --bg-primary: #0D0D0D;
      --bg-secondary: #161616;
      --bg-sidebar: #121212;
      --border-color: #262626;
      --text-primary: #FFFFFF;
      --text-secondary: #AAAAAA;
      --text-muted: #666666;
      --accent-blue: #1060FF;
      --accent-blue-hover: #2B72FF;
      --accent-blue-light: #152238;
      --card-bg: #1A1A1A;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 18px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.7);
      --grid-dot: rgba(255, 255, 255, 0.06);
      --track-bg: #2A2A2A;
      --modal-overlay: rgba(0, 0, 0, 0.65);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    #app-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    /* Titlebar */
    #titlebar {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-color);
      -webkit-app-region: drag;
    }
    .window-dots {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }
    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      cursor: pointer;
    }
    .dot-close { background: #FF5F56; }
    .dot-min { background: #FFBD2E; }
    .dot-max { background: #D0D0D0; }
    .app-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.2px;
    }
    .titlebar-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-app-region: no-drag;
    }
    .win-btn {
      width: 28px;
      height: 24px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
    }
    .win-btn:hover {
      background: var(--bg-secondary);
      color: var(--text-primary);
    }
    .win-btn.btn-close:hover {
      background: #FF4D4D;
      color: #FFFFFF;
    }
    /* Main Layout */
    #main-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    /* Sidebar */
    #sidebar {
      width: 240px;
      height: 100%;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
    }
    #sidebar-scroll::-webkit-scrollbar {
      width: 4px;
    }
    #sidebar-scroll::-webkit-scrollbar-thumb {
      background: var(--text-muted);
      border-radius: 2px;
    }
    .accordion-section {
      margin-bottom: 12px;
    }
    .accordion-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      transition: background 0.15s ease;
    }
    .accordion-header:hover {
      background: var(--bg-secondary);
    }
    .accordion-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .accordion-icon {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }
    .accordion-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }
    .accordion-arrow {
      width: 14px;
      height: 14px;
      transition: transform 0.2s ease;
      color: var(--text-muted);
    }
    .accordion-section.expanded .accordion-arrow {
      transform: rotate(180deg);
    }
    .accordion-content {
      display: none;
      padding: 4px 0 4px 16px;
    }
    .accordion-section.expanded .accordion-content {
      display: block;
    }
    .action-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      margin-bottom: 4px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: grab;
      border: 1.5px solid transparent;
      transition: all 0.15s ease;
    }
    .action-item:hover {
      background: var(--bg-primary);
      border-color: var(--border-color);
      box-shadow: var(--shadow-sm);
    }
    .action-item.selected {
      border-color: var(--accent-blue) !important;
      color: var(--accent-blue) !important;
      background: var(--accent-blue-light) !important;
    }
    .action-item.selected svg {
      fill: var(--accent-blue) !important;
      color: var(--accent-blue) !important;
    }
    .action-item-icon {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }
    .action-item-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }
    .custom-shortcut-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
    }
    .custom-shortcut-row:hover {
      background: var(--bg-secondary);
    }
    .custom-shortcut-left {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .edit-btn {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.15s ease;
    }
    .edit-btn:hover {
      color: var(--accent-blue);
    }
    .edit-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }
    #sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
    }
    .info-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.15s ease;
    }
    .info-btn:hover {
      color: var(--text-primary);
    }
    .info-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    /* Main Content Area */
    #content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg-primary);
      background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px);
      background-size: 16px 16px;
      overflow: hidden;
    }
    /* Top App Selector Bar */
    #app-tabs-bar {
      height: 60px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }
    .app-tab {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: var(--card-bg);
      border: 2px solid transparent;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
    }
    .app-tab:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    .app-tab.active {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 2px var(--accent-blue-light), var(--shadow-md);
    }
    .app-tab-logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: #FFFFFF;
    }
    .logo-ps {
      background: #001E36;
      color: #31A8FF;
      border: 1px solid #31A8FF;
    }
    .logo-ae {
      background: #1B0033;
      color: #9999FF;
      border: 1px solid #9999FF;
    }
    .logo-default {
      width: 32px;
      height: 32px;
    }
    .logo-default img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .app-delete-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #FF4D4D;
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(255, 77, 77, 0.4);
      transition: transform 0.12s ease;
    }
    .app-delete-badge:hover {
      transform: scale(1.15);
    }
    .add-app-tab {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--accent-blue-light);
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 22px;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
    }
    .add-app-tab:hover {
      background: #d8e5ff;
      transform: translateY(-1px);
    }
    /* Ring Canvas Container */
    #canvas-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #preview-ring {
      position: relative;
      width: 480px;
      height: 480px;
    }
    .preview-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }
    .preview-slot {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.18s ease;
    }
    .preview-slot:hover, .preview-slot.drag-hover {
      transform: translate(-50%, -50%) scale(1.12) !important;
      border-color: var(--accent-blue) !important;
      box-shadow: 0 4px 18px rgba(16, 96, 255, 0.25) !important;
      z-index: 20;
    }
    .preview-slot-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
    }
    .preview-slot-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }
    .preview-slot-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .preview-label-pill {
      position: absolute;
      background: var(--accent-blue);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 4px 12px rgba(16, 96, 255, 0.3);
      z-index: 10;
    }
    .preview-settings-btn {
      position: absolute;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent-blue);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(16, 96, 255, 0.35);
      pointer-events: none;
    }
    /* Bottom Controls */
    #bottom-bar {
      height: 64px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .theme-segmented {
      display: flex;
      align-items: center;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 3px;
    }
    .theme-pill-btn {
      padding: 5px 16px;
      border-radius: 16px;
      border: none;
      background: transparent;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .theme-pill-btn.active {
      background: var(--accent-blue);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(16, 96, 255, 0.3);
    }
    .radius-slider-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .radius-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 160px;
      height: 14px;
      background: var(--track-bg);
      border-radius: 7px;
      outline: none;
      position: relative;
    }
    .radius-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 5px solid var(--accent-blue);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
      transition: transform 0.1s ease;
    }
    .radius-slider::-webkit-slider-thumb:hover {
      transform: scale(1.1);
    }
    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--modal-overlay);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(2px);
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-card {
      width: 360px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      padding: 24px 20px 20px 20px;
      display: flex;
      flex-direction: column;
      animation: modalPop 0.18s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }
    @keyframes modalPop {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 4px;
    }
    .modal-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 18px;
    }
    .modal-search-box {
      display: flex;
      align-items: center;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 12px;
      gap: 10px;
      margin-bottom: 14px;
    }
    .modal-search-input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 13px;
      color: var(--text-primary);
    }
    .modal-search-icon, .modal-folder-btn {
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-folder-btn:hover {
      color: var(--accent-blue);
    }
    .modal-app-list {
      max-height: 160px;
      overflow-y: auto;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--bg-primary);
    }
    .modal-app-list::-webkit-scrollbar {
      width: 4px;
    }
    .modal-app-list::-webkit-scrollbar-thumb {
      background: var(--text-muted);
      border-radius: 2px;
    }
    .modal-app-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      cursor: pointer;
      transition: background 0.12s ease;
      border-bottom: 1px solid var(--border-color);
    }
    .modal-app-item:last-child {
      border-bottom: none;
    }
    .modal-app-item:hover, .modal-app-item.selected {
      background: var(--accent-blue-light);
    }
    .modal-app-item.selected .modal-app-name {
      color: var(--accent-blue);
      font-weight: 700;
    }
    .modal-app-icon-wrap {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: #FFFFFF;
    }
    .modal-app-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .modal-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .btn-pill {
      flex: 1;
      padding: 9px 0;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .btn-blue {
      background: var(--accent-blue);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(16, 96, 255, 0.3);
    }
    .btn-blue:hover {
      background: var(--accent-blue-hover);
    }
    .btn-gray {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }
    .btn-gray:hover {
      background: var(--border-color);
      color: var(--text-primary);
    }
    /* Key display box in Custom Shortcut modal */
    .key-display-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 22px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body class="theme-light">
  <div id="app-container">
    <!-- Titlebar -->
    <div id="titlebar">
      <div class="window-dots">
        <div class="dot dot-close" onclick="closeWindow()"></div>
        <div class="dot dot-min" onclick="minimizeWindow()"></div>
        <div class="dot dot-max"></div>
      </div>
      <div class="app-title">Halo (Preview)</div>
      <div class="titlebar-actions">
        <button class="win-btn" onclick="minimizeWindow()">─</button>
        <button class="win-btn btn-close" onclick="closeWindow()">✕</button>
      </div>
    </div>

    <!-- Main Body -->
    <div id="main-body">
      <!-- Left Sidebar -->
      <div id="sidebar">
        <div id="sidebar-scroll">
          <!-- Accordion: System -->
          <div class="accordion-section" id="acc-system">
            <div class="accordion-header" onclick="toggleAccordion('acc-system')">
              <div class="accordion-header-left">
                <div class="accordion-icon">
                  <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
                </div>
                <span>System</span>
              </div>
              <svg class="accordion-arrow" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z" fill="currentColor"/></svg>
            </div>
            <div class="accordion-content" id="list-system"></div>
          </div>

          <!-- Accordion: Media (expanded by default) -->
          <div class="accordion-section expanded" id="acc-media">
            <div class="accordion-header" onclick="toggleAccordion('acc-media')">
              <div class="accordion-header-left">
                <div class="accordion-icon">

  <script>
    let appConfig = null;
    let selectedAppId = "default";
    let runningAppsList = [];
    let selectedAppToAdd = null;
    let recordedShortcut = "Cmd + Shift + =";
    let recordedShortcutRaw = "ctrl+shift+=";

    const ICONS_MAP = {
      "play.svg": `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>`,

      "taskview.svg": `<svg viewBox="0 0 24 24"><path d="M4 6H2v12h2V6zm18 0h-2v12h2V6zM17 4H7c-.55 0-1 .45-1 1v14c0 .55.45 1 1 1h10c.55 0 1-.45 1-1V5c0-.55-.45-1-1-1zm-1 14H8V6h8v12z" fill="currentColor"/></svg>`,
      "lock.svg": `<svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" fill="currentColor"/></svg>`,
      "screenshot.svg": `<svg viewBox="0 0 24 24"><path d="M9 3L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.17L15 3H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="currentColor"/></svg>`,
      "emoji.svg": `<svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z" fill="currentColor"/></svg>`,
      "folder.svg": `<svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z" fill="currentColor"/></svg>`,
      "desktop.svg": `<svg viewBox="0 0 24 24"><path d="M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7l-2 3v1h8v-1l-2-3h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 12H3V4h18v10z" fill="currentColor"/></svg>`,
      "clipboard.svg": `<svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z" fill="currentColor"/></svg>`,
      "paste.svg": `<svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z" fill="currentColor"/></svg>`,
      "mute.svg": `<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" fill="currentColor"/></svg>`,
      "previous.svg": `<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" fill="currentColor"/></svg>`,
      "next.svg": `<svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" fill="currentColor"/></svg>`,
      "volumeup.svg": `<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" fill="currentColor"/></svg>`,
      "volumedown.svg": `<svg viewBox="0 0 24 24"><path d="M18.5 12H14v2h4.5V12zM5 9v6h4l5 5V4L9 9H5z" fill="currentColor"/></svg>`,
    };

    const SIDEBAR_ITEMS = {
      system: [
        { label: "New Note", icon: "note.svg", type: "hotkey", value: "win+n", category: "SYSTEM" },
        { label: "Lock Workstation", icon: "lock.svg", type: "hotkey", value: "win+l", category: "SYSTEM" },
        { label: "Show Desktop", icon: "desktop.svg", type: "hotkey", value: "win+d", category: "SYSTEM" },
        { label: "Task Manager", icon: "taskview.svg", type: "hotkey", value: "ctrl+shift+esc", category: "SYSTEM" },
      ],
      media: [
        { label: "Previous", icon: "previous.svg", type: "hotkey", value: "prevtrack", category: "MEDIA & VOLUME" },
        { label: "Play Pause", icon: "play.svg", type: "hotkey", value: "playpause", category: "MEDIA & VOLUME" },
        { label: "Next", icon: "next.svg", type: "hotkey", value: "nexttrack", category: "MEDIA & VOLUME" },
        { label: "Silent", icon: "mute.svg", type: "hotkey", value: "volumemute", category: "MEDIA & VOLUME" },
        { label: "Volume Up", icon: "volumeup.svg", type: "hotkey", value: "volumeup", category: "MEDIA & VOLUME" },
        { label: "Volume Down", icon: "volumedown.svg", type: "hotkey", value: "volumedown", category: "MEDIA & VOLUME" },
      ],
      nav: [
        { label: "Screenshot", icon: "screenshot.svg", type: "hotkey", value: "win+shift+s", category: "NAVIGATION" },
        { label: "Task View", icon: "taskview.svg", type: "hotkey", value: "win+tab", category: "NAVIGATION" },
      ],
      tools: [
        { label: "File Explorer", icon: "folder.svg", type: "hotkey", value: "win+e", category: "OPEN" },
        { label: "Emoji Panel", icon: "emoji.svg", type: "hotkey", value: "win+.", category: "KEYBOARD" },
        { label: "Clipboard History", icon: "clipboard.svg", type: "hotkey", value: "win+v", category: "KEYBOARD" },
        { label: "Paste Plain Text", icon: "paste.svg", type: "hotkey", value: "ctrl+shift+v", category: "KEYBOARD" },
      ]
    };

    function initUI() {
      renderSidebar();
    }

    function toggleAccordion(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle("expanded");
    }

    function renderSidebar() {
      for (const [catKey, items] of Object.entries(SIDEBAR_ITEMS)) {
        const container = document.getElementById(`list-${catKey}`);
        if (!container) continue;
        container.innerHTML = "";
        items.forEach((act) => {
          const div = document.createElement("div");
          div.className = "action-item";
          if (act.label === "Play Pause") {
            div.classList.add("selected");
          }
          div.draggable = true;
          div.ondragstart = (e) => {
            e.dataTransfer.setData("application/json", JSON.stringify(act));
          };

          const iconSpan = document.createElement("span");
          iconSpan.className = "action-item-icon";
          iconSpan.innerHTML = ICONS_MAP[act.icon] || ICONS_MAP["play.svg"];

          const labelSpan = document.createElement("span");
          labelSpan.textContent = act.label;

          div.appendChild(iconSpan);
          div.appendChild(labelSpan);
          container.appendChild(div);
        });
      }
    }

    function renderAppTabs() {
      const container = document.getElementById("app-tabs-bar");
      container.innerHTML = "";

      const apps = appConfig.apps || [];
      apps.forEach((app) => {
        const tab = document.createElement("div");
        tab.className = `app-tab ${app.id === selectedAppId ? "active" : ""}`;
        tab.onclick = () => selectApp(app.id);

        const logoDiv = document.createElement("div");
        if (app.id === "default") {
          logoDiv.className = "app-tab-logo logo-default";
          logoDiv.innerHTML = `<img src="data:image/png;base64,${appConfig.app_icon_base64 || ""}" alt="Halo"/>`;
        } else if (app.id === "photoshop" || app.name.toLowerCase().includes("photoshop")) {
          logoDiv.className = "app-tab-logo logo-ps";
          logoDiv.textContent = "Ps";
        } else if (app.id === "aftereffects" || app.name.toLowerCase().includes("after")) {
          logoDiv.className = "app-tab-logo logo-ae";
          logoDiv.textContent = "Ae";
        } else {
          logoDiv.className = "app-tab-logo logo-ps";
          logoDiv.textContent = app.name.slice(0, 2).toUpperCase();
        }

        tab.appendChild(logoDiv);

        if (app.id !== "default") {
          const delBadge = document.createElement("div");
          delBadge.className = "app-delete-badge";
          delBadge.textContent = "✕";
          delBadge.title = `Delete ${app.name} profile`;
          delBadge.onclick = (e) => {
            e.stopPropagation();
            deleteAppProfile(app.id);
          };
          tab.appendChild(delBadge);
        }

        container.appendChild(tab);
      });

      // Plus Button
      const addBtn = document.createElement("div");
      addBtn.className = "add-app-tab";
      addBtn.textContent = "+";
      addBtn.title = "Add Per-App Shortcut Profile";
      addBtn.onclick = () => openAddAppModal();
      container.appendChild(addBtn);
    }

    function selectApp(appId) {
      selectedAppId = appId;
      renderAppTabs();
      renderPreviewRing();
    }

    function deleteAppProfile(appId) {
      if (appId === "default") return;
      appConfig.apps = appConfig.apps.filter(a => a.id !== appId);
      if (selectedAppId === appId) {
        selectedAppId = "default";
      }
      saveConfigToBackend();
      renderAppTabs();
      renderPreviewRing();
    }

    function getActiveAppProfile() {
      if (!appConfig || !appConfig.apps) return null;
      return appConfig.apps.find(a => a.id === selectedAppId) || appConfig.apps[0];
    }

    function renderPreviewRing() {
      const slotsLayer = document.getElementById("preview-slots-layer");
      slotsLayer.innerHTML = "";

      const currentApp = getActiveAppProfile();
      if (!currentApp) return;

      const actions = currentApp.actions || [];
      const total = actions.length;
      const radius = appConfig.base_radius || 120;
      const center = 240; // 480 / 2

      actions.forEach((act, idx) => {
        const angleDeg = (idx * (360 / total)) - 90;
        const angleRad = (angleDeg * Math.PI) / 180;
        const x = center + radius * Math.cos(angleRad);
        const y = center + radius * Math.sin(angleRad);

        const slot = document.createElement("div");
        slot.className = "preview-slot";
        slot.style.left = `${x}px`;
        slot.style.top = `${y}px`;
        slot.style.transform = "translate(-50%, -50%)";

        const iconContainer = document.createElement("div");
        iconContainer.className = "preview-slot-icon";

        const isSettings = act.value === "open_settings";
        if (isSettings) {
          iconContainer.innerHTML = `<img src="data:image/png;base64,${appConfig.app_icon_base64 || ""}" alt="Halo"/>`;
          const pill = document.createElement("div");
          pill.className = "preview-settings-btn";
          pill.textContent = "Halo Settings";
          slot.appendChild(pill);
        } else {
          iconContainer.innerHTML = ICONS_MAP[act.icon] || ICONS_MAP["play.svg"];
        }
        slot.appendChild(iconContainer);

        // Tooltip label pill (always visible in preview as seen in Final Preview.png!)
        const pill = document.createElement("div");
        pill.className = "preview-label-pill";
        pill.textContent = act.label;

        const cos = Math.cos(angleRad);
        const sin = Math.sin(angleRad);
        if (Math.abs(cos) < 0.2) {
          pill.style.left = "50%";
          if (sin < 0) {
            pill.style.bottom = "58px";
            pill.style.transform = "translateX(-50%)";
          } else {
            pill.style.top = "58px";
            pill.style.transform = "translateX(-50%)";
          }
        } else if (Math.abs(sin) < 0.2) {
          pill.style.top = "50%";
          if (cos < 0) {
            pill.style.right = "58px";
            pill.style.transform = "translateY(-50%)";
          } else {
            pill.style.left = "58px";
            pill.style.transform = "translateY(-50%)";
          }
        } else {
          if (cos < 0) {
            pill.style.right = "44px";
          } else {
            pill.style.left = "44px";
          }
          if (sin < 0) {
            pill.style.bottom = "36px";
          } else {
            pill.style.top = "36px";
          }
        }
        slot.appendChild(pill);

        // Drag & Drop onto slot
        slot.ondragover = (e) => {
          e.preventDefault();
          slot.classList.add("drag-hover");
        };
        slot.ondragleave = () => {
          slot.classList.remove("drag-hover");
        };
        slot.ondrop = (e) => {
          e.preventDefault();
          slot.classList.remove("drag-hover");
          const dataText = e.dataTransfer.getData("application/json");
          if (dataText) {
            try {
              const droppedAction = JSON.parse(dataText);
              if (act.value !== "open_settings") {
                currentApp.actions[idx] = droppedAction;
                saveConfigToBackend();
                renderPreviewRing();
              }
            } catch (err) {}
          }
        };

        slotsLayer.appendChild(slot);
      });
    }

    function setTheme(theme) {
      if (!appConfig) return;
      appConfig.theme = theme;
      document.body.className = `theme-${theme}`;

      document.getElementById("btn-theme-light").classList.toggle("active", theme === "light");
      document.getElementById("btn-theme-dark").classList.toggle("active", theme === "dark");

      saveConfigToBackend();
    }

    function onRadiusChange(val) {
      if (!appConfig) return;
      appConfig.base_radius = parseInt(val, 10);
      renderPreviewRing();
      saveConfigToBackend();
    }

    function saveConfigToBackend() {
      if (window.ipc) {
        window.ipc.postMessage(JSON.stringify({
          type: "save_config",
          config: appConfig
        }));
      }
    }

    /* Modals Logic */
    function openAddAppModal() {
      document.getElementById("modal-add-app").classList.add("open");
      document.getElementById("app-search-input").value = "";
      selectedAppToAdd = null;
      if (window.ipc) {
        window.ipc.postMessage(JSON.stringify({ type: "get_running_apps" }));
      }
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove("open");
    }

    function onModalBgClick(e, modalId) {
      if (e.target.id === modalId) {
        closeModal(modalId);
      }
    }

    function updateRunningAppsList(apps) {
      runningAppsList = apps;
      renderModalAppList(apps);
    }

    function renderModalAppList(apps) {
      const listEl = document.getElementById("modal-app-list");
      listEl.innerHTML = "";

      if (apps.length === 0) {
        listEl.innerHTML = `<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:13px;">No running applications found</div>`;
        return;
      }

      apps.forEach((app) => {
        const item = document.createElement("div");
        item.className = `modal-app-item ${selectedAppToAdd && selectedAppToAdd.executable === app.executable ? "selected" : ""}`;
        item.onclick = () => {
          selectedAppToAdd = app;
          renderModalAppList(apps);
        };

        const iconWrap = document.createElement("div");
        const nameLower = app.name.toLowerCase();
        if (nameLower.includes("photoshop")) {
          iconWrap.className = "modal-app-icon-wrap logo-ps";
          iconWrap.textContent = "Ps";
        } else if (nameLower.includes("after")) {
          iconWrap.className = "modal-app-icon-wrap logo-ae";
          iconWrap.textContent = "Ae";
        } else {
          iconWrap.className = "modal-app-icon-wrap logo-ps";
          iconWrap.textContent = app.name.slice(0, 2).toUpperCase();
        }

        const nameSpan = document.createElement("div");
        nameSpan.className = "modal-app-name";
        nameSpan.textContent = app.name;

        item.appendChild(iconWrap);
        item.appendChild(nameSpan);
        listEl.appendChild(item);
      });
    }

    function filterRunningApps(query) {
      const q = query.toLowerCase().trim();
      if (!q) {
        renderModalAppList(runningAppsList);
        return;
      }
      const filtered = runningAppsList.filter(a => a.name.toLowerCase().includes(q) || a.executable.toLowerCase().includes(q));
      renderModalAppList(filtered);
    }

    function browseExecutable() {
      if (window.ipc) {
        window.ipc.postMessage(JSON.stringify({ type: "browse_app" }));
      }
    }

    function confirmAddApp() {
      if (!selectedAppToAdd) return;
      const newAppId = selectedAppToAdd.executable.replace(/\.exe$/i, "").toLowerCase();

      // Check if already exists
      let existing = appConfig.apps.find(a => a.id === newAppId || a.executable.toLowerCase() === selectedAppToAdd.executable.toLowerCase());
      if (existing) {
        selectApp(existing.id);
        closeModal("modal-add-app");
        return;
      }

      const defaultActions = JSON.parse(JSON.stringify(appConfig.apps[0].actions));
      const newProfile = {
        id: newAppId,
        name: selectedAppToAdd.name,
        executable: selectedAppToAdd.executable,
        icon: newAppId,
        actions: defaultActions,
      };

      appConfig.apps.push(newProfile);
      selectApp(newAppId);
      saveConfigToBackend();
      closeModal("modal-add-app");
    }

    function openCustomShortcutModal() {
      document.getElementById("modal-custom-shortcut").classList.add("open");
      recordedShortcut = document.getElementById("custom-shortcut-label").textContent;
      document.getElementById("key-recorder-display").textContent = recordedShortcut;
    }

    window.addEventListener("keydown", (e) => {
      const modal = document.getElementById("modal-custom-shortcut");
      if (modal && modal.classList.contains("open")) {
        e.preventDefault();
        const modifiers = [];
        if (e.metaKey) modifiers.push("Cmd");
        if (e.ctrlKey) modifiers.push("Ctrl");
        if (e.shiftKey) modifiers.push("Shift");
        if (e.altKey) modifiers.push("Alt");

        let key = e.key;
        if (["Control", "Shift", "Alt", "Meta"].includes(key)) {
          return;
        }

        if (key === "=" || key === "+") key = "=";
        else if (key.length === 1) key = key.toUpperCase();

        const formatted = [...modifiers, key].join(" + ");
        recordedShortcut = formatted;
        recordedShortcutRaw = formatted.toLowerCase().replace(/ /g, "");
        document.getElementById("key-recorder-display").textContent = formatted;
      }
    });

    function saveCustomShortcut() {
      document.getElementById("custom-shortcut-label").textContent = recordedShortcut;
      if (appConfig) {
        appConfig.custom_shortcuts = [{
          label: recordedShortcut,
          value: recordedShortcutRaw,
          category: "CUSTOM"
        }];
        saveConfigToBackend();
      }
      closeModal("modal-custom-shortcut");
    }

    function minimizeWindow() {
      if (window.ipc) {
        window.ipc.postMessage(JSON.stringify({ type: "minimize_window" }));
      }
    }

    function closeWindow() {
      if (window.ipc) {
        window.ipc.postMessage(JSON.stringify({ type: "close_window" }));
      }
    }

    window.loadSettingsData = function(config) {
      appConfig = config;
      selectedAppId = config.active_app_id || "default";

      // Apply theme
      setTheme(config.theme || "light");

      // Set radius slider
      const radiusInput = document.getElementById("radius-slider");
      if (radiusInput) {
        radiusInput.value = config.base_radius || 120;
      }

      if (config.custom_shortcuts && config.custom_shortcuts.length > 0) {
        document.getElementById("custom-shortcut-label").textContent = config.custom_shortcuts[0].label;
      }

      renderAppTabs();
      renderPreviewRing();
    };

    window.onAppFileSelected = function(app) {
      selectedAppToAdd = app;
      confirmAddApp();
    };

    window.onRunningAppsLoaded = function(apps) {
      updateRunningAppsList(apps);
    };

    initUI();
  </script>
</body>
</html>

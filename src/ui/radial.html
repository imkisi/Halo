<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title>Halo Radial</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    :root, html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      background-color: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #overlay {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      background-color: transparent !important;
    }
    #ring-container {
      position: absolute;
      width: 520px;
      height: 520px;
      pointer-events: none;
      transform: scale(0.2);
      opacity: 0;
      transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.18s ease-out;
    }
    #ring-container.visible {
      transform: scale(1);
      opacity: 1;
      pointer-events: auto;
    }
    .center-node {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.15s ease;
      z-index: 10;
    }
    .theme-light .center-node {
      background: #EBEBEB;
      color: #777777;
    }
    .theme-light .center-node:hover {
      background: #dfdfdf;
      color: #333333;
    }
    .theme-dark .center-node {
      background: #252525;
      color: #AAAAAA;
    }
    .theme-dark .center-node:hover {
      background: #333333;
      color: #FFFFFF;
    }
    .ring-slot {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.16s cubic-bezier(0.2, 0.8, 0.4, 1), border-color 0.15s ease, box-shadow 0.15s ease;
      z-index: 5;
    }
    .theme-light .ring-slot {
      background: #FFFFFF;
      border: 2px solid #EDEDED;
      color: #4A4A4A;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }
    .theme-dark .ring-slot {
      background: #0D0D0D;
      border: 2px solid #2D2D2D;
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .ring-slot:hover {
      transform: translate(-50%, -50%) scale(1.12) !important;
      border-color: #1060FF !important;
      border-width: 3px !important;
      box-shadow: 0 6px 20px rgba(16, 96, 255, 0.28) !important;
      z-index: 20;
    }
    .ring-slot:hover svg {
      color: #1060FF !important;
      fill: #1060FF !important;
    }
    .slot-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .slot-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }
    .slot-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .tooltip-pill {
      position: absolute;
      background: #1060FF;
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.9);
      transition: opacity 0.14s ease, transform 0.14s cubic-bezier(0.2, 0.9, 0.4, 1.2);
      box-shadow: 0 4px 12px rgba(16, 96, 255, 0.35);
      z-index: 25;
    }
    .ring-slot:hover .tooltip-pill {
      opacity: 1;
      transform: scale(1);
    }
    .settings-pill {
      position: absolute;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      background: #1060FF;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(16, 96, 255, 0.35);
      pointer-events: none;
    }
  </style>
</head>
<body class="theme-light">
  <div id="overlay" onclick="onBackgroundClick(event)">
    <div id="ring-container">
      <div class="center-node" onclick="closeRadial(event)">✕</div>
      <div id="slots-layer"></div>
    </div>
  </div>

  <script>
    let currentConfig = null;
    const ringContainer = document.getElementById("ring-container");
    const slotsLayer = document.getElementById("slots-layer");

    const ICONS_MAP = {
      "play.svg": `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>`,
      "note.svg": `<svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" fill="currentColor"/></svg>`,
      "taskview.svg": `<svg viewBox="0 0 24 24"><path d="M4 6H2v12h2V6zm18 0h-2v12h2V6zM17 4H7c-.55 0-1 .45-1 1v14c0 .55.45 1 1 1h10c.55 0 1-.45 1-1V5c0-.55-.45-1-1-1zm-1 14H8V6h8v12z" fill="currentColor"/></svg>`,
      "lock.svg": `<svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" fill="currentColor"/></svg>`,
      "screenshot.svg": `<svg viewBox="0 0 24 24"><path d="M9 3L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.17L15 3H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="currentColor"/></svg>`,
      "emoji.svg": `<svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z" fill="currentColor"/></svg>`,
      "folder.svg": `<svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z" fill="currentColor"/></svg>`,
      "desktop.svg": `<svg viewBox="0 0 24 24"><path d="M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7l-2 3v1h8v-1l-2-3h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 12H3V4h18v10z" fill="currentColor"/></svg>`,
      "clipboard.svg": `<svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z" fill="currentColor"/></svg>`,
      "paste.svg": `<svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z" fill="currentColor"/></svg>`,
      "mute.svg": `<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" fill="currentColor"/></svg>`,
      "previous.svg": `<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" fill="currentColor"/></svg>`,
      "next.svg": `<svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" fill="currentColor"/></svg>`,
      "volumeup.svg": `<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" fill="currentColor"/></svg>`,
      "volumedown.svg": `<svg viewBox="0 0 24 24"><path d="M18.5 12H14v2h4.5V12zM5 9v6h4l5 5V4L9 9H5z" fill="currentColor"/></svg>`,
    };

    function renderRadial(config) {
      currentConfig = config;
      document.body.className = `theme-${config.theme || "light"}`;
      slotsLayer.innerHTML = "";

      const actions = config.actions || [];
      const total = actions.length;
      const radius = config.base_radius || 120;
      const center = 260; // 520 / 2

      actions.forEach((act, idx) => {
        const angleDeg = (idx * (360 / total)) - 90;
        const angleRad = (angleDeg * Math.PI) / 180;
        const x = center + radius * Math.cos(angleRad);
        const y = center + radius * Math.sin(angleRad);

        const slot = document.createElement("div");
        slot.className = "ring-slot";
        slot.style.left = `${x}px`;
        slot.style.top = `${y}px`;
        slot.style.transform = "translate(-50%, -50%)";

        const iconContainer = document.createElement("div");
        iconContainer.className = "slot-icon";

        const isSettings = act.value === "open_settings";
        if (isSettings) {
          iconContainer.innerHTML = `<img src="data:image/png;base64,${config.app_icon_base64 || ""}" alt="Halo"/>`;
          const pill = document.createElement("div");
          pill.className = "settings-pill";
          pill.textContent = "Halo Settings";
          slot.appendChild(pill);
        } else {
          const svgCode = ICONS_MAP[act.icon] || ICONS_MAP["play.svg"];
          iconContainer.innerHTML = svgCode;
        }

        slot.appendChild(iconContainer);

        // Tooltip pill
        const tooltip = document.createElement("div");
        tooltip.className = "tooltip-pill";
        tooltip.textContent = act.label;

        // Position tooltip based on quadrant
        const cos = Math.cos(angleRad);
        const sin = Math.sin(angleRad);
        if (Math.abs(cos) < 0.2) {
          tooltip.style.left = "50%";
          tooltip.style.transformOrigin = "center";
          if (sin < 0) {
            tooltip.style.bottom = "58px";
            tooltip.style.transform = "translateX(-50%)";
          } else {
            tooltip.style.top = "58px";
            tooltip.style.transform = "translateX(-50%)";
          }
        } else if (Math.abs(sin) < 0.2) {
          tooltip.style.top = "50%";
          if (cos < 0) {
            tooltip.style.right = "58px";
            tooltip.style.transform = "translateY(-50%)";
          } else {
            tooltip.style.left = "58px";
            tooltip.style.transform = "translateY(-50%)";
          }
        } else {
          if (cos < 0) {
            tooltip.style.right = "44px";
          } else {
            tooltip.style.left = "44px";
          }
          if (sin < 0) {
            tooltip.style.bottom = "36px";
          } else {
            tooltip.style.top = "36px";
          }
        }

        slot.appendChild(tooltip);

        slot.onclick = (e) => {
          e.stopPropagation();
          executeAction(act);
        };

        slotsLayer.appendChild(slot);
      });
    }

    function showRadial(config) {
      renderRadial(config);
      ringContainer.classList.add("visible");
    }

    function hideRadial() {
      ringContainer.classList.remove("visible");
    }

    function executeAction(act) {
      hideRadial();
      if (window.ipc) {
        window.ipc.postMessage(JSON.stringify({
          type: "execute",
          action: act
        }));
      }
    }

    function closeRadial(e) {
      if (e) e.stopPropagation();
      hideRadial();
      if (window.ipc) {
        window.ipc.postMessage(JSON.stringify({ type: "close" }));
      }
    }

    function onBackgroundClick(e) {
      if (e.target.id === "overlay") {
        closeRadial(e);
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeRadial();
      }
    });

    window.updateRadial = function(config) {
      showRadial(config);
    };
  </script>
</body>
</html>
